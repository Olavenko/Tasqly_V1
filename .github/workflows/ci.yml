name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [gcc, clang, mingw]
        exclude:
          - os: windows-latest
            compiler: gcc
          - os: windows-latest
            compiler: clang
          - os: ubuntu-latest
            compiler: mingw

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------------------------------------------------------
    # Print tool versions (Diagnosis)
    # ---------------------------------------------------------------
    - name: Print tool versions
      run: |
        echo "=== Compiler ==="
        g++ --version || echo "g++ not found"
        echo "=== CMake ==="
        cmake --version || echo "cmake not found"
        echo "=== Ninja ==="
        ninja --version || echo "ninja not found"
        echo "=== QMake ==="
        qmake --version || echo "qmake not found"

    # ---------------------------------------------------------------
    # Linux: Install Qt
    # ---------------------------------------------------------------
    - name: Install Qt (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.2'
        host: linux
        target: desktop

    # ---------------------------------------------------------------
    # Windows: Setup MSYS2 + MinGW + Qt
    # ---------------------------------------------------------------
    - name: Setup MSYS2
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          git
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja

    - name: Upgrade GCC to latest (Windows MinGW)
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      shell: msys2 {0}
      run: |
        pacman -Sy --noconfirm
        pacman -S --noconfirm mingw-w64-x86_64-gcc

    - name: Add MinGW to PATH
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install Qt (Windows MinGW)
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.2'
        host: windows
        target: desktop
        arch: win64_mingw

    - name: Add Qt to PATH (Windows MinGW)
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      run: echo "C:\Qt\6.8.2\mingw_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # ---------------------------------------------------------------
    # Setup CMake
    # ---------------------------------------------------------------
    - name: Setup CMake
      uses: lukka/get-cmake@latest

    # ---------------------------------------------------------------
    # Configure / Build / Test
    # ---------------------------------------------------------------
    - name: Configure
      run: >
        cmake --preset=${{ matrix.compiler }}-debug
        ${{ (matrix.os == 'ubuntu-latest' && format('-DCMAKE_PREFIX_PATH={0}/Qt/6.8.2/gcc_64', github.workspace)) || '' }}
        ${{ (matrix.os == 'windows-latest' && matrix.compiler == 'mingw' && '-DCMAKE_PREFIX_PATH=C:/Qt/6.8.2/mingw_64') || '' }}

    - name: Build
      run: cmake --build --preset=build-${{ matrix.compiler }}-debug

    - name: Run tests
      run: ctest --preset=test-${{ matrix.compiler }}-debug --output-on-failure
