name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            qt_path: ${{ github.workspace }}/../Qt/6.8.2/gcc_64
          - os: ubuntu-latest
            compiler: clang
            qt_path: ${{ github.workspace }}/../Qt/6.8.2/gcc_64
          - os: windows-latest
            compiler: mingw
            qt_path: C:/Qt/6.8.2/mingw_64

    runs-on: ${{ matrix.os }}

    env:
      QT_PATH: ${{ matrix.qt_path }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------------------------------------------------------
    # Print tool versions (Linux)
    # ---------------------------------------------------------------
    - name: Print tool versions (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "=== Compiler ==="
        g++ --version || echo "g++ not found"
        echo "=== CMake ==="
        cmake --version || echo "cmake not found"
        echo "=== Ninja ==="
        ninja --version || echo "ninja not found"

    # ---------------------------------------------------------------
    # Windows: Setup MSYS2 + MinGW + Qt
    # ---------------------------------------------------------------
    - name: Setup MSYS2
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          git
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja

    - name: Add MinGW to PATH
      if: matrix.os == 'windows-latest'
      run: echo "C:/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install Qt (Windows MinGW)
      if: matrix.os == 'windows-latest'
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.2'
        host: windows
        target: desktop
        arch: win64_mingw

    - name: Add Qt to PATH (Windows MinGW)
      if: matrix.os == 'windows-latest'
      run: echo "${{ env.QT_PATH }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # ---------------------------------------------------------------
    # Setup CMake
    # ---------------------------------------------------------------
    - name: Setup CMake
      uses: lukka/get-cmake@latest

    # ---------------------------------------------------------------
    # Configure
    # ---------------------------------------------------------------
    - name: Configure
      run: cmake --preset=${{ matrix.compiler }}-debug

    # ---------------------------------------------------------------
    # Build
    # ---------------------------------------------------------------
    - name: Build
      run: cmake --build --preset=build-${{ matrix.compiler }}-debug

    # ---------------------------------------------------------------
    # Run tests
    # ---------------------------------------------------------------
    - name: Run tests
      run: ctest --preset=test-${{ matrix.compiler }}-debug --output-on-failure
