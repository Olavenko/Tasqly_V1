name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [gcc, clang, mingw]
        exclude:
          - os: windows-latest
            compiler: gcc
          - os: windows-latest
            compiler: clang
          - os: ubuntu-latest
            compiler: mingw

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------------------------------------------------------
    # Linux: Install Qt
    # ---------------------------------------------------------------
    - name: Install Qt (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.2'
        host: linux
        target: desktop

    - name: Verify Qt (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: ls -R ${{ github.workspace }}/Qt

    # ---------------------------------------------------------------
    # Windows: Setup MSYS2 + MinGW + Qt
    # ---------------------------------------------------------------
    - name: Setup MSYS2
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          git
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
    
    - name: Add MinGW to PATH
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install Qt (Windows MinGW)
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.2'
        host: windows
        target: desktop
        arch: win64_mingw

    - name: Verify Qt (Windows)
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      run: dir C:\Qt

    # ---------------------------------------------------------------
    # Setup CMake
    # ---------------------------------------------------------------
    - name: Setup CMake
      uses: lukka/get-cmake@latest

    # ---------------------------------------------------------------
    # Configure / Build / Test
    # ---------------------------------------------------------------
    - name: Configure (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: >
        cmake --preset=${{ matrix.compiler }}-debug
        -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.8.2/gcc_64"

    - name: Configure (Windows MinGW)
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      run: >
        cmake --preset=mingw-debug
        -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_PREFIX_PATH="C:/Qt/6.8.2/mingw_64"

    - name: Build
      run: cmake --build --preset=build-debug

    - name: Run tests
      run: ctest --preset=test-debug --output-on-failure
