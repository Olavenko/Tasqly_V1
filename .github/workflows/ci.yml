#
# 🧱 File: .github/workflows/ci.yml
# ---------------------------------
# 📌 Purpose   : Unified CI pipeline for Tasqly (Windows MSVC + MinGW + Linux)
# 🧱 Layer     : CI/CD (GitHub Actions)
# 👤 Author    : Tasqly AI Assistant
# 🗓️ Updated   : 2025-09-30
#
# 🧠 Description:
# - Order of execution: format-check → MSVC → MinGW → Linux.
# - MSVC: Debug build for tests + coverage, Release build for benchmarks.
# - MinGW: Debug build + run tests.
# - Linux (GCC + Clang): Debug build + run tests.
# - Reports (coverage + benchmarks) are generated on MSVC and uploaded as artifacts.
#

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # 📝 Lint — clang-format
  # ------------------------------------------------------------
  format-check:
    name: Lint • Clang-Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format-20
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-format-20
      - name: Check formatting
        shell: bash
        run: ./scripts/check-format.sh

  # ------------------------------------------------------------
  # 🔒 Security — git-secrets
  # ------------------------------------------------------------
  secrets-scan:
    name: Security • Git-Secrets Scan
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - uses: actions/checkout@v4
      - name: Install git-secrets
        run: |
          sudo apt-get update
          sudo apt-get install -y git
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets && sudo make install
      - name: Run secrets scan
        run: git secrets --scan

  # ------------------------------------------------------------
  # 🪟 Windows — MSVC 2022 (coverage + benchmarks)
  # ------------------------------------------------------------
  windows-msvc:
    name: Windows • MSVC 2022 • Build + Test + Reports
    runs-on: windows-2022
    needs: secrets-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Dev Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja
        shell: powershell
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y
          }
          ninja --version

      - name: Setup Qt 6.9.2 (MSVC)
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.9.2
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: false

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ------------------------------------------------------------
      # 🧩 Setup Local PostgreSQL Server for Integration Tests
      # ------------------------------------------------------------
      - name: Install and Initialize PostgreSQL Server (Windows)
        shell: powershell
        run: |
          Write-Host "Installing PostgreSQL 15..."
          choco install postgresql15 --no-progress -y
          
          $pgRoot = "C:\Program Files\PostgreSQL\15"
          $pgBin = "$pgRoot\bin"
          $pgData = "C:\pgdata"
          
          echo "PG_ROOT=$pgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PGDATA=$pgData" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "INCLUDE=$pgRoot\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "LIB=$pgRoot\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          Write-Host "PostgreSQL installed at $pgRoot"

          # ------------------------------------------------------------
          # 🔧 Initialize a clean PostgreSQL data directory
          # ------------------------------------------------------------
          
          if (Test-Path $pgData) {
            Write-Host "Removing existing PGDATA folder..."
            Remove-Item -Recurse -Force $pgData
          }

          Write-Host "Initializing database cluster at $pgData ..."
          $pwFile = "$pgData\pw.txt"
          New-Item -ItemType Directory -Force -Path $pgData | Out-Null
          "themyth2060" | Out-File -FilePath $pwFile -Encoding ascii

          & "$pgBin\initdb.exe" -D "$pgData" -U postgres --pwfile=$pwFile
          if ($LASTEXITCODE -ne 0) {
            throw "❌ initdb failed."
          }

          # ------------------------------------------------------------
          # 🚀 Start PostgreSQL service manually
          # ------------------------------------------------------------
          Write-Host "Starting PostgreSQL..."
          & "$pgBin\pg_ctl.exe" start -D "$pgData" -l "$pgData\logfile.log"
          Start-Sleep -Seconds 10

          # ------------------------------------------------------------
          # 🧩 Create the test database
          # ------------------------------------------------------------
          Write-Host "Creating test database 'tasqly_test'..."
          & "$pgBin\createdb.exe" -U postgres tasqly_test
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create test database."
          }

          Write-Host "PostgreSQL service started successfully and tasqly_test created."

      - name: Verify PostgreSQL is running
        shell: powershell
        run: |
          $pgBin = "C:\Program Files\PostgreSQL\17\bin"
          & "$pgBin\pg_isready.exe" -U postgres
          Write-Host "PostgreSQL connection verified successfully."

      # ------------------------------------------------------------
      # 🧪 Build & Test — Debug (Coverage)
      # ------------------------------------------------------------
      - name: Configure Debug (MSVC Coverage)
        shell: powershell
        env:
          TASQLY_PG_ROOT: ${{ env.PG_ROOT }}
        run: |
          if (Test-Path build/msvc-tests-reports-debug) { Remove-Item -Recurse -Force build/msvc-tests-reports-debug }
          cmake --preset=msvc-tests-reports-debug -DENABLE_COVERAGE=ON -DTASQLY_TEST_PHASE=Phase1

      - name: Build Debug (MSVC Coverage)
        shell: powershell
        run: cmake --build --preset=build-msvc-tests-reports-debug --target coverage_tests --parallel

      - name: Run Tests (MSVC Debug + Coverage)
        shell: powershell
        run: ctest --test-dir build/msvc-tests-reports-debug --output-on-failure

      # ------------------------------------------------------------
      # 📊 Generate Coverage Reports
      # ------------------------------------------------------------
      - name: Install Python dependencies for coverage report
        shell: powershell
        run: |
          pip install --upgrade pip
          pip install plotly pandas

      - name: Generate Coverage Reports
        shell: powershell
        run: |
          python scripts/coverage_report_updated.py reports/coverage/tests/coverage.xml all --archive Phase0

      # ------------------------------------------------------------
      # ⚙️ Benchmarks — Release Build
      # ------------------------------------------------------------
      - name: Configure Release (MSVC Benchmarks)
        shell: powershell
        run: |
          if (Test-Path build/msvc-benchmarks-release) { Remove-Item -Recurse -Force build/msvc-benchmarks-release }
          cmake --preset=msvc-benchmarks-release -DTASQLY_BENCHMARK_PHASE=Phase1

      - name: Build Release (MSVC Benchmarks)
        shell: powershell
        run: cmake --build --preset=build-msvc-benchmarks-release --parallel

      - name: Run Benchmarks
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: |
          python scripts/run_benchmarks.py --phase Phase1 --compiler msvc --timeout 3600

      # ------------------------------------------------------------
      # 📤 Upload Reports
      # ------------------------------------------------------------
      - name: Upload Test Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tests-Coverage-Report-MSVC
          path: |
            reports/tests/**/*.md
            reports/tests/**/*.html
            reports/tests/**/*.json

      - name: Upload Benchmark Performance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Benchmarks-Reports-MSVC
          path: |
            reports/benchmarks/**/*.md
            reports/benchmarks/**/*.html
            reports/benchmarks/**/*.json

      # ------------------------------------------------------------
      # 🧹 Shutdown PostgreSQL After Tests
      # ------------------------------------------------------------
      - name: Stop PostgreSQL Server
        if: always()
        shell: powershell
        run: |
          $pgBin = "C:\Program Files\PostgreSQL\15\bin"
          & "$pgBin\pg_ctl.exe" stop -D "$env:PGDATA" -m fast
          Write-Host "PostgreSQL stopped and cleaned up."

  # ------------------------------------------------------------
  # 🪟 Windows — MinGW (Debug only)
  # ------------------------------------------------------------
  windows-mingw:
    name: Windows • MinGW • Build + Test
    runs-on: windows-latest
    needs: windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # ------------------------------------------------------------
      # 🧩 Install and Run PostgreSQL Server for Integration Tests
      # ------------------------------------------------------------
      - name: Install PostgreSQL Server (Windows)
        shell: powershell
        run: |
          Write-Host "Installing PostgreSQL 15..."
          choco install postgresql15 --no-progress -y
          
          $pgRoot = "C:\Program Files\PostgreSQL\15"
          $pgBin  = "$pgRoot\bin"
          $pgData = "C:\pgdata"  
          
          Write-Host "PostgreSQL installed at $pgRoot"
          echo "PG_ROOT=$pgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PGDATA=$pgData"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "INCLUDE=$pgRoot\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "LIB=$pgRoot\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if (Test-Path $pgData) {
            Write-Host "Removing existing data folder..."
            Remove-Item -Recurse -Force $pgData
          }

          # 📦 Initialize new PostgreSQL cluster
          Write-Host "Initializing new cluster at $pgData ..."
          New-Item -ItemType Directory -Force -Path $pgData | Out-Null
          $pwFile = "$pgData\pw.txt"
          New-Item -ItemType Directory -Force -Path $pgData | Out-Null
          "themyth2060" | Out-File -FilePath $pwFile -Encoding ascii
          & "$pgBin\initdb.exe" -D "$pgData" -U postgres --pwfile=$pwFile
          if ($LASTEXITCODE -ne 0) { throw "initdb failed." }

          # 🚀 Start PostgreSQL service
          Write-Host "Starting PostgreSQL..."
          & "$pgBin\pg_ctl.exe" start -D "$pgData" -l "$pgData\logfile.log"
          Start-Sleep -Seconds 10

          # 🧩 Create the test database
          Write-Host "Creating test database tasqly_test..."
          & "$pgBin\createdb.exe" -U postgres tasqly_test
          if ($LASTEXITCODE -ne 0) { throw "Failed to create test database." }

          Write-Host "PostgreSQL service started successfully and tasqly_test created."

      - name: Verify PostgreSQL is running
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $pgBin = "C:\Program Files\PostgreSQL\15\bin"
          & "$pgBin\pg_isready.exe" -U postgres
          Write-Host "PostgreSQL connection verified successfully."
          
      # ------------------------------------------------------------
      # ⚙️ Build + Test with MSYS2 (MinGW)
      # ------------------------------------------------------------
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-shadertools
            
      - name: Configure Debug (MinGW)
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          echo "QT_PREFIX=/mingw64" >> $GITHUB_ENV
          rm -rf build/mingw-debug
          cmake --preset=mingw-debug -DTASQLY_TEST_PHASE=Phase1
          
      - name: Build Debug (MinGW)
        shell: msys2 {0}
        run: cmake --build --preset=build-mingw-debug --parallel
        
      - name: Run Tests (MinGW Debug)
        shell: msys2 {0}
        run: ctest --preset=test-mingw-debug --output-on-failure
        
      # ------------------------------------------------------------
      # 🧹 Stop PostgreSQL after tests
      # ------------------------------------------------------------
      - name: Stop PostgreSQL Server  
        if: always()
        shell: powershell
        run: |
          $pgBin = "C:\Program Files\PostgreSQL\15\bin"
          & "$pgBin\pg_ctl.exe" stop -D "$env:PGDATA" -m fast
          Write-Host "PostgreSQL stopped and cleaned up."

  # ------------------------------------------------------------
  # 🐧 Linux (GCC + Clang, Debug only)
  # ------------------------------------------------------------
  linux:
    name: Linux • ${{ matrix.compiler }} • Build + Test
    runs-on: ubuntu-latest
    needs: windows-mingw
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    # ------------------------------------------------------------
    # 🧩 PostgreSQL Service Container
    # ------------------------------------------------------------
    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: themyth2060
          POSTGRES_DB: tasqly_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build clang python3-pip libpq-dev
          cmake --version
          ninja --version

      - name: Wait for PostgreSQL
        run: |
          echo "⏳ Waiting for PostgreSQL to be ready..."
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting..."; sleep 2
          done
          echo "✅ PostgreSQL is ready."

      - name: Setup Qt 6.9.2
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.9.2
          host: linux
          target: desktop
          cache: true
          
      - name: Configure Debug (${{ matrix.compiler }})
        run: |
          rm -rf build/${{ matrix.compiler }}-debug
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --preset=gcc-debug -DTASQLY_TEST_PHASE=Phase1
          else
            cmake --preset=clang-debug -DTASQLY_TEST_PHASE=Phase1
          fi
          
      - name: Build Debug (${{ matrix.compiler }})
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --build --preset=build-gcc-debug --parallel
          else
            cmake --build --preset=build-clang-debug --parallel
          fi
          
      - name: Run Tests (${{ matrix.compiler }} Debug)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: themyth2060
          PGDATABASE: tasqly_test
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            ctest --preset=test-gcc-debug --output-on-failure
          else
            ctest --preset=test-clang-debug --output-on-failure
          fi

