name: ci

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  linux:
    name: Linux • ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      # Install Qt 6.9.3
      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.9.3
          host: linux
          target: desktop
          cache: true

      - name: Configure env
        run: |
          echo "CMAKE_PREFIX_PATH=${Qt6_DIR}" >> $GITHUB_ENV
          echo "Compiler: ${{ matrix.compiler }}"
          cmake --version
          qmake --version || true
          echo "Qt6_DIR=${Qt6_DIR}"

      - name: Configure
        run: |
          rm -rf build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --preset=gcc-debug
          else
            cmake --preset=clang-debug
          fi

      - name: Build
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --build --preset=build-gcc-debug --parallel
          else
            cmake --build --preset=build-clang-debug --parallel
          fi

      - name: Test
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            ctest --preset=test-gcc-debug --output-on-failure
          else
            ctest --preset=test-clang-debug --output-on-failure
          fi

  windows-mingw:
    name: Windows • MSYS2 MinGW64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-shadertools

      - name: Configure
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          echo "QT_PREFIX=/mingw64" >> $GITHUB_ENV
          echo "Using $(g++ --version | head -n1)"
          echo "CMake: $(cmake --version | head -n1)"
          qmake --version || true
          rm -rf build
          cmake --preset=mingw-debug

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset=build-mingw-debug --parallel

      - name: Test
        shell: msys2 {0}
        run: ctest --preset=test-mingw-debug --output-on-failure
