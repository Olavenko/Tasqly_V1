name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: windows-latest
            compiler: mingw

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------------------------------------------------------
    # Linux: Install Qt
    # ---------------------------------------------------------------
    - name: Install Qt (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.2'
        host: linux
        target: desktop

    - name: Debug Qt (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "Qt6_DIR=$Qt6_DIR"
        echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"
        which qmake || echo "qmake not found"
        qmake --version || true

    # ---------------------------------------------------------------
    # Windows: Setup MSYS2 + MinGW + Qt
    # ---------------------------------------------------------------
    - name: Setup MSYS2
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          git
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja

    - name: Install Qt (Windows MinGW)
      if: matrix.os == 'windows-latest'
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.2'
        host: windows
        target: desktop
        arch: win64_mingw

    - name: Debug Qt (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        echo "Qt6_DIR=$env:Qt6_DIR"
        echo "CMAKE_PREFIX_PATH=$env:CMAKE_PREFIX_PATH"
        where qmake || echo "qmake not found"
        qmake --version || exit 0

    - name: Add MinGW to PATH
      if: matrix.os == 'windows-latest'
      run: echo "C:/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # ---------------------------------------------------------------
    # Setup CMake
    # ---------------------------------------------------------------
    - name: Setup CMake
      uses: lukka/get-cmake@latest

    # ---------------------------------------------------------------
    # Configure
    # ---------------------------------------------------------------
    - name: Configure (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: cmake --preset=${{ matrix.compiler }}-debug

    - name: Configure (Windows MinGW)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: cmake --preset=mingw-debug

    # ---------------------------------------------------------------
    # Build
    # ---------------------------------------------------------------
    - name: Build (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: cmake --build --preset=build-${{ matrix.compiler }}-debug

    - name: Build (Windows MinGW)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: cmake --build --preset=build-mingw-debug

    # ---------------------------------------------------------------
    # Run tests
    # ---------------------------------------------------------------
    - name: Run tests (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: ctest --preset=test-${{ matrix.compiler }}-debug --output-on-failure

    - name: Run tests (Windows MinGW)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: ctest --preset=test-mingw-debug --output-on-failure
