#
# 🧱 File: .github/workflows/ci.yml
# ---------------------------------
# 📌 Purpose   : Unified CI pipeline for Tasqly (Linux + Windows)
# 🧱 Layer     : CI/CD (GitHub Actions)
# 👤 Author    : Tasqly AI Assistant
# 🗓️ Updated   : 2025-09-01
#
# 🧠 Description:
# - Linux jobs build with GCC and Clang using Qt 6.9.2 (base package only).
# - Windows job builds with MSYS2 MinGW64 toolchain and Qt6 from MSYS2 repos.
# - Presets from CMakePresets.json are used everywhere.
# - Cache usage is disabled to avoid noisy warnings (400 errors) from GitHub Actions cache service.
#

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # 🐧 Linux (GCC + Clang) — Qt 6.9.2
  # ------------------------------------------------------------
  linux:
    name: Linux • ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build clang python3-pip
          cmake --version
          ninja --version

      - name: (Diag) Query available Qt 6.9.2
        run: |
          python3 -m pip install --upgrade aqtinstall
          python3 -m aqt list-qt linux desktop 6.9.2 || true
          python3 -m aqt list-qt linux desktop --modules 6.9.2 gcc_64 || true

      - name: Setup Qt 6.9.2
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.9.2
          host: linux
          target: desktop
          # cache intentionally disabled to avoid cache warnings
          cache: false

      - name: Configure environment
        run: |
          echo "CMAKE_PREFIX_PATH=${Qt6_DIR}" >> $GITHUB_ENV
          echo "Qt6_DIR=${Qt6_DIR}"
          qmake --version || true

      - name: Configure
        run: |
          rm -rf build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --preset=gcc-debug
          else
            cmake --preset=clang-debug
          fi

      - name: Build
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --build --preset=build-gcc-debug --parallel
          else
            cmake --build --preset=build-clang-debug --parallel
          fi

      - name: Test
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            ctest --preset=test-gcc-debug --output-on-failure
          else
            ctest --preset=test-clang-debug --output-on-failure
          fi

  # ------------------------------------------------------------
  # 🪟 Windows — MSYS2 MinGW64
  # ------------------------------------------------------------
  windows-mingw:
    name: Windows • MSYS2 MinGW64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-shadertools

      - name: Configure
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          echo "QT_PREFIX=/mingw64" >> $GITHUB_ENV
          g++ --version | head -n1
          cmake --version | head -n1
          qmake --version || true
          rm -rf build
          cmake --preset=mingw-debug

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset=build-mingw-debug --parallel

      - name: Test
        shell: msys2 {0}
        run: ctest --preset=test-mingw-debug --output-on-failure
