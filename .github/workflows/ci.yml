# 🧱 File: .github/workflows/ci.yml
# ---------------------------------
# 📌 Purpose      : High-Performance Modular CI Pipeline for Tasqly
# 🧱 Layer        : CI/CD (GitHub Actions)
# 👤 Maintainer   : Tasqly AI Assistant
# 🗓️ Created      : 2025-10-26
# 🗓️ Refactored   : 2025-11-03
# 🧪 Optimized     : 2025-11-XX
# 📝 Version      : 2.0.0
#
# 🧠 Description:
# This pipeline is a fully-modular, composite-action-driven CI system designed for
# maximum performance, maintainability, and cross-platform consistency.
#
# Key Features:
#   • Modular architecture using Composite Actions (Windows / Linux / Tools).
#   • Parallelized pre-check stages (Clang-Format + Git-Secrets).
#   • Optimized Windows build flow (MSVC → MinGW).
#   • Split Linux jobs (GCC + Clang) for true multi-VM parallel execution.
#   • Dedicated PostgreSQL service for integration testing.
#   • Clean YAML surface—jobs reduced to single-line references.
#   • Faster, more stable, and highly maintainable CI design.
#
# ⚙️ Target Platforms:
#   • Ubuntu (GCC / Clang / PostgreSQL)
#   • Windows Server (MSVC 2022, MinGW via MSYS2)
#
# 🚀 Notes:
#   • All heavy logic lives inside modular actions under .github/actions/
#   • This is the official high-performance CI design for Tasqly ≥ v2.0

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # 📝 Lint — clang-format
  # ------------------------------------------------------------
  clang-format-check:
    name: Lint • Clang-Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clang-format-check

  # ------------------------------------------------------------
  # 🔒 Security — git-secrets
  # ------------------------------------------------------------
  secrets-scan:
    name: Security • Git-Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/secrets-scan

  # ------------------------------------------------------------
  # 🪟 Windows — MSVC 2022 (coverage + benchmarks)
  # ------------------------------------------------------------
  windows-msvc:
    name: Windows • MSVC 2022 • Build + Test + Reports
    runs-on: windows-2022
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-msvc

  # ------------------------------------------------------------
  # 🪟 Windows — MinGW (Debug only)
  # ------------------------------------------------------------
  windows-mingw:
    name: Windows • MinGW • Build + Test
    runs-on: windows-latest
    needs: windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-mingw
      
  # ------------------------------------------------------------
  # 🐧 Linux GCC — Debug + PostgreSQL Integration
  # ------------------------------------------------------------
  linux-gcc:
    name: Linux • GCC • Integration + DB Tests
    runs-on: ubuntu-latest
    needs: windows-mingw

    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: tasqly_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=10s
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PGDATABASE: tasqly_test

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux
        with:
          compiler: gcc

  # ------------------------------------------------------------
  # 🐧 Linux Clang — Debug + PostgreSQL Integration
  # ------------------------------------------------------------
  linux-clang:
    name: Linux • Clang • Integration + DB Tests
    runs-on: ubuntu-latest
    needs: windows-mingw

    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: tasqly_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=10s
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PGDATABASE: tasqly_test

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux
        with:
          compiler: clang

  #------------------------------------------------------------
  # 🐧 Linux Sanitizers — GCC + Clang
  #------------------------------------------------------------
  linux-sanitizers:
    name: Linux • Sanitizers (GCC + Clang)
    runs-on: ubuntu-latest
    needs: windows-mingw  # parallel with linux-gcc & linux-clang

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: tasqly_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=10s

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PGDATABASE: tasqly_test

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-sanitizers
        with:
          compiler: ${{ matrix.compiler }}
