# 🧱 File: .github/workflows/ci.yml
# ---------------------------------
# 📌 Purpose   : Unified CI pipeline for Tasqly (PostgreSQL Linux-only)
# 🧱 Layer     : CI/CD (GitHub Actions)
# 👤 Author    : Tasqly AI Assistant
# 🗓️ Created   : 2025-10-01
# 🗓️ Updated   : 2025-11-03
# 📝 Version   : 1.0.0
#
# 🧠 Description:
# - PostgreSQL integration tests now run ONLY on Linux (Docker service).
# - Windows jobs (MSVC + MinGW) run unit tests & benchmarks only.
# - Common linting & security jobs preserved.
# - Reports (coverage + benchmarks) remain unchanged.
#

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # 📝 Lint — clang-format
  # ------------------------------------------------------------
  clang-format-check:
    name: Lint • Clang-Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format-20
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-format-20
      - name: Check formatting
        shell: bash
        run: ./scripts/check-format.sh

  # ------------------------------------------------------------
  # 🔒 Security — git-secrets
  # ------------------------------------------------------------
  secrets-scan:
    name: Security • Git-Secrets
    runs-on: ubuntu-latest
    needs: [clang-format-check]
    steps:
      - uses: actions/checkout@v4
      - name: Install git-secrets
        run: |
          sudo apt-get update
          sudo apt-get install -y git
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets && sudo make install
      - name: Run secrets scan
        run: git secrets --scan

  # ------------------------------------------------------------
  # 🪟 Windows — MSVC 2022 (coverage + benchmarks)
  # ------------------------------------------------------------
  windows-msvc:
    name: Windows • MSVC 2022 • Build + Test + Reports
    runs-on: windows-2022
    needs: [secrets-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Dev Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja
        shell: powershell
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y
          }
          ninja --version


      # ------------------------------------------------------------
      # 🧩 Setup Qt 6.9.2 (MSVC)
      # ------------------------------------------------------------
      - name: Setup Qt 6.9.2 (MSVC)
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.9.2
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: false

      # ------------------------------------------------------------
      # 🧩 Setup Python 3.13
      # ------------------------------------------------------------
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ------------------------------------------------------------
      # 🧩 Install OpenCppCoverage
      # ------------------------------------------------------------
      - name: Install OpenCppCoverage
        shell: powershell
        run: |
          choco install opencppcoverage --no-progress -y
          $exePath = (Get-Command OpenCppCoverage.exe -ErrorAction SilentlyContinue).Source
          if (-not $exePath) {
            $searchDirs = @(
              "C:\\ProgramData\\chocolatey\\bin",
              "C:\\Program Files\\OpenCppCoverage"
            )
            $exePath = $searchDirs |
              ForEach-Object { Get-ChildItem -Path $_ -Filter "OpenCppCoverage*.exe" -Recurse -ErrorAction SilentlyContinue } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exePath) {
            throw "OpenCppCoverage executable not found after installation."
          }
          Write-Output " OpenCppCoverage installed at: $exePath"
          echo (Split-Path $exePath) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ------------------------------------------------------------
      # --- Coverage (Debug) ---
      # ------------------------------------------------------------
      - name: Configure Debug (MSVC Coverage)
        shell: powershell
        run: |
          if (Test-Path build/msvc-tests-reports-debug) { Remove-Item -Recurse -Force build/msvc-tests-reports-debug }
          cmake --preset=msvc-tests-reports-debug -DENABLE_COVERAGE=ON -DTASQLY_TEST_PHASE=Phase1

      - name: Build Debug (MSVC Coverage)
        shell: powershell
        run: cmake --build --preset=build-msvc-tests-reports-debug --target coverage_tests --parallel

      - name: Run Tests (MSVC Debug + Coverage)
        shell: powershell
        run: ctest --test-dir build/msvc-tests-reports-debug --output-on-failure

      - name: Install Python dependencies for coverage report
        shell: powershell
        run: |
          pip install --upgrade pip
          pip install plotly pandas

      - name: Generate Coverage Reports
        shell: powershell
        run: |
          python scripts/coverage_report_updated.py reports/coverage/tests/coverage.xml all --archive Phase1

      # ------------------------------------------------------------
      # --- Benchmarks (Release) ---
      # ------------------------------------------------------------
      - name: Configure Release (MSVC Benchmarks)
        shell: powershell
        run: |
          if (Test-Path build/msvc-benchmarks-release) { Remove-Item -Recurse -Force build/msvc-benchmarks-release }
          cmake --preset=msvc-benchmarks-release -DTASQLY_BENCHMARK_PHASE=Phase1

      - name: Build Release (MSVC Benchmarks)
        shell: powershell
        run: cmake --build --preset=build-msvc-benchmarks-release --parallel

      - name: Run Benchmarks
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: |
          python scripts/run_benchmarks.py --phase Phase1 --compiler msvc --timeout 3600

      # ------------------------------------------------------------
      # --- Upload Coverage Reports ---
      # ------------------------------------------------------------
      - name: Upload Test Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tests-Coverage-Report-MSVC
          path: |
            reports/tests/**/*.md
            reports/tests/**/*.html
            reports/tests/**/*.json

      # ------------------------------------------------------------
      # --- Upload Benchmark Reports ---
      # ------------------------------------------------------------
      - name: Upload Benchmark Performance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-Reports-MSVC
          path: |
            reports/benchmarks/**/*.md
            reports/benchmarks/**/*.html
            reports/benchmarks/**/*.json

  # ------------------------------------------------------------
  # 🪟 Windows — MinGW (Debug only)
  # ------------------------------------------------------------
  windows-mingw:
    name: Windows • MinGW • Build + Test
    runs-on: windows-latest
    needs: [windows-msvc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-shadertools
      # ------------------------------------------------------------
      # 🧱 Configure Project (MinGW)
      # ------------------------------------------------------------
      - name: Configure Debug (MinGW)
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          echo "QT_PREFIX=/mingw64" >> $GITHUB_ENV
          rm -rf build/mingw-debug
          cmake --preset=mingw-debug -DTASQLY_TEST_PHASE=Phase1
  
      # ------------------------------------------------------------
      # 🏗️ Build Project (MinGW)
      # ------------------------------------------------------------
      - name: Build Debug (MinGW)
        shell: msys2 {0}
        run: cmake --build --preset=build-mingw-debug --parallel

      # ------------------------------------------------------------
      # 🐘 Ensure PostgreSQL Client (libpq.dll)
      # ------------------------------------------------------------
      - name: Ensure PostgreSQL Client (for MinGW)
        shell: msys2 {0}
        run: |
          echo "Ensuring PostgreSQL client (libpq.dll) is available..."
          pacman -S --noconfirm mingw-w64-x86_64-postgresql
          ls /mingw64/bin | grep libpq || echo "libpq.dll still missing!"
          echo "PostgreSQL client ensured."

  
      # ------------------------------------------------------------
      # 🧪 Run Tests (MinGW Debug)
      # ------------------------------------------------------------
      - name: Run Tests (MinGW Debug)
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          echo "PATH updated with /mingw64/bin"
          ldd build/mingw-debug/TasqlyTestsRunner.exe || true
          ctest --preset=test-mingw-debug --output-on-failure
      
  # ------------------------------------------------------------
  # 🧪 Linux — Sanitizers (ASan + UBSan) • Debug Build
  # ------------------------------------------------------------
  linux-sanitizers:
    name: Linux • Sanitizers (ASan + UBSan) • Debug
    runs-on: ubuntu-latest
    needs: [windows-mingw]

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 🔧 Install Compiler Toolchain
      # ------------------------------------------------------------
      - name: Install Toolchain
        run: |
          sudo apt-get update
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            sudo apt-get install -y g++ gcc
          else
            sudo apt-get install -y clang
          fi

      # ------------------------------------------------------------
      # 🧱 Configure Project with Sanitizers
      # ------------------------------------------------------------
      - name: Configure Debug (Sanitizers)
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            cmake --preset=gcc-debug -DTASQLY_TEST_PHASE=Phase1 -DSANITIZERS=ON
          else
            cmake --preset=clang-debug -DTASQLY_TEST_PHASE=Phase1 -DSANITIZERS=ON
          fi

      # ------------------------------------------------------------
      # 🧩 Setup Qt 6.9.2 (Linux)
      # ------------------------------------------------------------
      - name: Setup Qt 6.9.2
        id: qt
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.9.2
          host: linux
          target: desktop
          dir: ${{ github.workspace }}/Qt

      - name: Set up Qt environment
        run: |
          echo "QT_ROOT=${{ steps.qt.outputs.qt-dir }}" >> $GITHUB_ENV
          echo "${{ steps.qt.outputs.qt-dir }}/gcc_64/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=${{ steps.qt.outputs.qt-dir }}/gcc_64/lib/cmake/Qt6" >> $GITHUB_ENV


      # ------------------------------------------------------------
      # 🏗️ Build Project
      # ------------------------------------------------------------
      - name: Build Debug
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            cmake --build --preset=build-gcc-debug --parallel
          else
            cmake --build --preset=build-clang-debug --parallel
          fi

      # ------------------------------------------------------------
      # 🧪 Run Tests under Sanitizers
      # ------------------------------------------------------------
      - name: Run Tests (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_init_order=true
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=true
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            ctest --preset=test-gcc-debug --output-on-failure
          else
            ctest --preset=test-clang-debug --output-on-failure
          fi

      # ------------------------------------------------------------
      # 📦 Upload Sanitizer Logs
      # ------------------------------------------------------------
      - name: Upload Sanitizer Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs-${{ matrix.compiler }}
          path: |
            build/${{ matrix.compiler }}-debug/**/*.log
            build/${{ matrix.compiler }}-debug/**/*.txt
            build/${{ matrix.compiler }}-debug/**/*asan*
            build/${{ matrix.compiler }}-debug/**/*ubsan*

  # ------------------------------------------------------------
  # 🧮 Linux — Unified Coverage (gcov + lcov + script) • Debug Build
  # ------------------------------------------------------------
  linux-coverage:
    name: Linux • Unified Coverage (gcov + lcov + script) • Debug
    runs-on: ubuntu-latest
    needs: [linux-sanitizers]

    steps:
      # ------------------------------------------------------------
      # 📦 Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 🔧 Install coverage tools and Python dependencies
      # ------------------------------------------------------------
      - name: Install Coverage Tools and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcovr ninja-build python3 python3-pip build-essential
          pip install --upgrade pip
          pip install plotly pandas

      # ------------------------------------------------------------
      # 🧩 Setup Qt 6.9.2 (Linux)
      # ------------------------------------------------------------
      - name: Setup Qt 6.9.2
        id: qt
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.9.2
          host: linux
          target: desktop
          dir: ${{ github.workspace }}/Qt

      - name: Set up Qt environment
        run: |
          echo "QT_ROOT=${{ steps.qt.outputs.qt-dir }}" >> $GITHUB_ENV
          echo "${{ steps.qt.outputs.qt-dir }}/gcc_64/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=${{ steps.qt.outputs.qt-dir }}/gcc_64/lib/cmake/Qt6" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # 🧱 Configure Build (with coverage)
      # ------------------------------------------------------------
      - name: Configure Debug (Coverage)
        run: |
          mkdir -p build/gcc-coverage
          cd build/gcc-coverage
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_COMPILER=gcc \
            -DENABLE_COVERAGE=ON \
            -DTASQLY_TEST_PHASE=Phase1 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DTASQLY_BUILD_TESTS=ON \
            -DTASQLY_BUILD_BENCHMARKS=OFF \
            -DTASQLY_BUILD_REPORTS=OFF \
            -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}" \
            ../..

      # ------------------------------------------------------------
      # 🏗️ Build Tests
      # ------------------------------------------------------------
      - name: Build Tests with Coverage
        run: |
          cmake --build build/gcc-coverage --target TasqlyTestsRunner --parallel

      # ------------------------------------------------------------
      # 🧪 Run Tests with Coverage
      # ------------------------------------------------------------
      - name: Run Tests with Coverage
        run: |
          cd build/gcc-coverage
          ctest --output-on-failure

      # ------------------------------------------------------------
      # 📊 Generate Coverage Reports
      # ------------------------------------------------------------
      - name: Generate gcovr XML Report
        run: |
          mkdir -p reports/coverage/tests
          cd build/gcc-coverage
          gcovr -r ../.. \
            --filter='.*/src/.*' \
            --exclude='.*/tests/.*' \
            --exclude='.*/moc_.*' \
            --exclude='.*/qrc_.*' \
            --exclude='.*/ui_.*' \
            --xml \
            --output=../../reports/coverage/tests/coverage.xml

      # ------------------------------------------------------------
      # � Generate Unified Coverage Report (same as MSVC)
      # ------------------------------------------------------------
      - name: Generate Unified Coverage Report
        run: |
          python scripts/coverage_report_updated.py reports/coverage/tests/coverage.xml all --archive Phase1

      # ------------------------------------------------------------
      # � Upload Coverage Artifacts
      # ------------------------------------------------------------
      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-coverage-artifacts
          path: |
            reports/coverage/**
            reports/tests/**

      # ------------------------------------------------------------
      # 📦 Upload Artifacts
      # ------------------------------------------------------------
      - name: Upload Test Coverage Reports (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tests-Coverage-Report-Linux
          path: |
            reports/tests/**/*.md
            reports/tests/**/*.html
            reports/tests/**/*.json
            reports/coverage/tests/coverage.xml
      
      - name: Upload Benchmark Reports (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-Reports-Linux
          path: |
            reports/benchmarks/**/*.md
            reports/benchmarks/**/*.html
            reports/benchmarks/**/*.json
            
  # ------------------------------------------------------------
  # 🐧 Linux (GCC + Clang, Debug only, PostgreSQL integration)
  # ------------------------------------------------------------
  linux:
    name: Linux • ${{ matrix.compiler }} • Integration + DB Tests
    runs-on: ubuntu-latest
    needs: [linux-coverage]
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: themyth2060
          POSTGRES_DB: tasqly_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 🧩 Dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build clang python3-pip libpq-dev
          cmake --version
          ninja --version

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting..."; sleep 2
          done
          echo "PostgreSQL is ready."

      - name: Show PostgreSQL Environment
        run: |
          printenv | grep PG || true

      # ------------------------------------------------------------
      # 🧩 Initialize Schema (migration)
      # ------------------------------------------------------------
      - name: Initialize PostgreSQL Schema
        env:
          PGPASSWORD: themyth2060
        run: |
          echo "Applying migration schema to tasqly_test..."
          psql -h localhost -U postgres -d tasqly_test -f src/infra/migrations/P1_S2_create_tasks.sql
          echo "Schema applied successfully."

      # ------------------------------------------------------------
      # 🧩 Setup Qt
      # ------------------------------------------------------------
      - name: Setup Qt 6.9.2
        id: qt
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.9.2
          host: linux
          target: desktop
          cache: false
          dir: ${{ github.workspace }}/Qt
          
      - name: Set up Qt environment
        run: |
          echo "QT_ROOT=${{ steps.qt.outputs.qt-dir }}" >> $GITHUB_ENV
          echo "${{ steps.qt.outputs.qt-dir }}/gcc_64/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=${{ steps.qt.outputs.qt-dir }}/gcc_64/lib/cmake/Qt6" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # 🧪 Build & Test
      # ------------------------------------------------------------
      - name: Configure Debug (${{ matrix.compiler }})
        run: |
          rm -rf build/${{ matrix.compiler }}-debug
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --preset=gcc-debug -DTASQLY_TEST_PHASE=Phase1 -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}"
          else
            cmake --preset=clang-debug -DTASQLY_TEST_PHASE=Phase1 -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}"
          fi

      - name: Build Debug (${{ matrix.compiler }})
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --build --preset=build-gcc-debug --parallel
          else
            cmake --build --preset=build-clang-debug --parallel
          fi

      # ✅ Run ALL tests (unit + integration + postgres)
      - name: Run PostgreSQL Integration Tests (${{ matrix.compiler }})
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: themyth2060
          PGDATABASE: tasqly_test
        run: |
          echo "Running PostgreSQL Integration Tests..."
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            ctest --preset=test-gcc-debug --output-on-failure 
          else
            ctest --preset=test-clang-debug --output-on-failure
          fi