name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: windows-latest
            compiler: mingw

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------------------------------------------------------
    # Linux: Install Qt
    # ---------------------------------------------------------------
    - name: Install Qt (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.9.2'
        host: linux
        target: desktop

    - name: Debug Qt (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "Qt6_DIR=$Qt6_DIR"
        echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"
        which qmake || echo "qmake not found"
        qmake --version || true

    # ---------------------------------------------------------------
    # Windows: Install Qt (with bundled MinGW only)
    # ---------------------------------------------------------------
    - name: Install Qt (Windows MinGW)
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.9.2'
        host: windows
        target: desktop
        arch: win64_mingw

    - name: Add Qt MinGW to PATH
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      run: echo "${{ env.Qt6_DIR }}/../Tools/mingw1310_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Set QT_PATH env
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      run: echo "QT_PATH=$env:Qt6_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Verify MinGW compiler
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      run: |
        where g++
        g++ --version

    - name: Debug Qt (Windows)
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      run: |
        echo "Qt6_DIR=$env:Qt6_DIR"
        echo "QT_PATH=$env:QT_PATH"
        qmake --version || exit 0

    # ---------------------------------------------------------------
    # Setup CMake
    # ---------------------------------------------------------------
    - name: Setup CMake
      uses: lukka/get-cmake@latest

    # ---------------------------------------------------------------
    # Configure
    # ---------------------------------------------------------------
    - name: Configure
      run: cmake --preset=${{ matrix.compiler }}-debug

    # ---------------------------------------------------------------
    # Build
    # ---------------------------------------------------------------
    - name: Build
      run: cmake --build --preset=build-${{ matrix.compiler }}-debug

    # ---------------------------------------------------------------
    # Run tests
    # ---------------------------------------------------------------
    - name: Run tests
      run: ctest --preset=test-${{ matrix.compiler }}-debug --output-on-failure
