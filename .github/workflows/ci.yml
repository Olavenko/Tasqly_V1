#
# 🧱 File: .github/workflows/ci.yml
# ---------------------------------
# 📌 Purpose   : Unified CI pipeline for Tasqly (Linux + Windows)
# 🧱 Layer     : CI/CD (GitHub Actions)
# 👤 Author    : Tasqly AI Assistant
# 🗓️ Updated   : 2025-09-01
#
# 🧠 Description:
# - Linux jobs build with GCC and Clang using Qt 6.9.2 (no extra modules needed; base archive includes required bits).
# - Windows job builds with MSYS2 MinGW64 toolchain (gcc + ninja) and Qt6 from MSYS2 repos.
# - Presets from CMakePresets.json are used everywhere; no hardcoded compilers in CI.
# - The pipeline prints useful diagnostics to simplify troubleshooting.
#

name: ci

on:
  push:
    branches: ["**"]            # Run on all branches
  pull_request:                   # Also on PRs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # 🐧 Linux (GCC + Clang) — Qt 6.9.2 (no modules specified)
  # ------------------------------------------------------------
  linux:
    name: Linux • ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Base build tools (ninja + clang for the clang matrix)
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build clang python3-pip
          cmake --version
          ninja --version

      # 3) (Diag) List available Qt to help if mirrors change
      - name: (Diag) Query available Qt 6.9.2
        run: |
          python3 -m pip install --upgrade aqtinstall
          python3 -m aqt list-qt linux desktop 6.9.2 || true
          # Modules listing (informational only)
          python3 -m aqt list-qt linux desktop --modules 6.9.2 gcc_64 || true

      # 4) Install Qt 6.9.2 — base package is sufficient for Qt6 CMake packages
      - name: Setup Qt 6.9.2
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.9.2
          host: linux
          target: desktop
          arch: gcc_64
          cache: true
          # No 'modules' here — base includes the necessary CMake config for Qt6

      # 5) Export CMAKE_PREFIX_PATH so CMake can find Qt6
      - name: Configure environment
        run: |
          echo "CMAKE_PREFIX_PATH=${Qt6_DIR}" >> $GITHUB_ENV
          echo "Qt6_DIR=${Qt6_DIR}"
          qmake --version || true

      # 6) Configure with the appropriate preset (gcc/clang)
      - name: Configure
        run: |
          rm -rf build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --preset=gcc-debug
          else
            cmake --preset=clang-debug
          fi

      # 7) Build using the paired build preset
      - name: Build
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --build --preset=build-gcc-debug --parallel
          else
            cmake --build --preset=build-clang-debug --parallel
          fi

      # 8) Run tests
      - name: Test
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            ctest --preset=test-gcc-debug --output-on-failure
          else
            ctest --preset=test-clang-debug --output-on-failure
          fi

  # ------------------------------------------------------------
  # 🪟 Windows — MSYS2 MinGW64 (Unified baseline)
  # ------------------------------------------------------------
  windows-mingw:
    name: Windows • MSYS2 MinGW64
    runs-on: windows-latest
    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Provision MSYS2 toolchain + Qt6 packages
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-shadertools

      # 3) Configure using the MinGW preset (toolchain picks compilers from PATH)
      - name: Configure
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"           # Ensure MSYS2 toolchain is first
          echo "QT_PREFIX=/mingw64" >> $GITHUB_ENV   # Consumed by CMakePresets.json
          g++ --version | head -n1
          cmake --version | head -n1
          qmake --version || true
          rm -rf build
          cmake --preset=mingw-debug

      # 4) Build
      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset=build-mingw-debug --parallel

      # 5) Test
      - name: Test
        shell: msys2 {0}
        run: ctest --preset=test-mingw-debug --output-on-failure
