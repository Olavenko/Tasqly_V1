name: UML Diagrams

on:
  push:
    paths:
      - 'docs/uml/**/*.puml'
      - 'docs/uml/config/**'
      - 'docs/uml/uml-export.sh'
  pull_request:
    paths:
      - 'docs/uml/**/*.puml'
      - 'docs/uml/config/**'
      - 'docs/uml/uml-export.sh'

jobs:
  generate-uml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java for PlantUML
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Install PlantUML & Graphviz
      - name: Install PlantUML & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2025.1/plantuml-1.2025.1.jar

      # Run UML export script (standardized)
      - name: Run UML export script
        run: bash docs/uml/uml-export.sh

      # Upload UML diagrams as CI artifact
      - name: Upload UML diagrams
        uses: actions/upload-artifact@v4
        with:
          name: UML-Diagrams
          path: docs/uml/exports/
