name: UML Diagrams to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-uml:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java for PlantUML
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Install PlantUML & Graphviz
      - name: Install PlantUML & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          curl -L -o docs/uml/tools/plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2025.1/plantuml-1.2025.1.jar

      # Run UML export script (generates SVGs + index.html)
      - name: Run UML export script
        run: bash docs/uml/uml-export.sh

      # Deploy diagrams (including index.html) to GitHub Pages
      - name: Deploy diagrams to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/uml/exports
