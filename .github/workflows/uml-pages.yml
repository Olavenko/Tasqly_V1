# ------------------------------------------------------------
# 🧱 File: .github/workflows/uml-pages.yml
# ------------------------------------------------------------
# 📌 Purpose   : Deploy UML diagrams (SVG + index.html) to GitHub Pages
# 🧱 Layer     : CI/CD (GitHub Actions)
# 👤 Author    : Mohamed Ali
# 🗓️ Updated   : 2025-09-02
#
# 🧠 Description:
# Triggered on pushes to `main` that affect UML diagrams or configs.
# Builds all `.puml` into `.svg` using `uml-export.sh` (PlantUML + Graphviz),
# then publishes the artifacts to GitHub Pages for browsing.
# ------------------------------------------------------------

name: UML Diagrams to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/uml/**/*.puml'
      - 'docs/uml/config/**'
      - 'docs/uml/uml-export.sh'

jobs:
  build-uml:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 🛠️ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # ☕ Setup Java runtime (PlantUML requires Java 11+)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 📦 Install PlantUML + Graphviz
      - name: Install PlantUML & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          mkdir -p docs/uml/tools
          curl -L -o docs/uml/tools/plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2025.1/plantuml-1.2025.1.jar

      # 🖼️ Run export script (generates SVGs + index.html)
      - name: Run UML export script
        run: bash docs/uml/uml-export.sh

      # 🚀 Deploy diagrams to GitHub Pages
      - name: Deploy diagrams to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/uml/exports
