# 🧱 File: .github/workflows/ci/security.yml
# ---------------------------------
# 📌 Purpose   : Run security scans and secret detection
# 🧱 Layer     : CI/CD (GitHub Actions)
# 👤 Author    : Tasqly AI Assistant
# 📅 Created   : 2025-11-18
# 🗓️ Updated   : 2025-11-18
# 📝 Version   : 1.0.0
#
# 🧠 Description:
# - Scans the codebase for accidentally committed secrets
# - Uses git-secrets to detect sensitive information
# - Prevents secrets from being committed to version control
#
# 🔗 Depends On:
#   - git-secrets
# 🔗 Related   : 
#   - .github/workflows/ci/_main.yml
#   - .github/workflows/ci/linting.yml
# ✅ Tested In : GitHub Actions (Ubuntu)
# ⚠️ Errors    : Fails if potential secrets are detected
# ⚡ Performance: Fast execution, optimized scanning
# 🔒 Security  : High - handles secret detection

name: Security Scanning

on:
  workflow_call:

jobs:
  git-secrets:
    name: Security • Git-Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install git-secrets
        run: |
          sudo apt-get update
          sudo apt-get install -y git
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets && sudo make install
      - name: Run secrets scan
        run: git secrets --scan
