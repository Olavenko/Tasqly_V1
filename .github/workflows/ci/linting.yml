# 🧱 File: .github/workflows/ci/linting.yml
# ---------------------------------
# 📌 Purpose   : Enforce code style and formatting standards
# 🧱 Layer     : CI/CD (GitHub Actions)
# 👤 Author    : Tasqly AI Assistant
# 📅 Created   : 2025-11-18
# 🗓️ Updated   : 2025-11-18
# 📝 Version   : 1.0.0
#
# 🧠 Description:
# - Runs clang-format to ensure consistent code formatting
# - Verifies code style compliance before allowing merges
# - Provides feedback on style violations
#
# 🔗 Depends On:
#   - clang-format-20
#   - scripts/check-format.sh
# 🔗 Related   : 
#   - .github/workflows/ci/_main.yml
# ✅ Tested In : GitHub Actions (Ubuntu)
# ⚠️ Errors    : Fails if code doesn't meet formatting standards
# ⚡ Performance: Fast execution, runs only on changed files
# 🔒 Security  : No sensitive data handling

name: Linting and Code Quality

on:
  workflow_call:

jobs:
  clang-format:
    name: Lint • Clang-Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format-20
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-format-20
      - name: Check formatting
        shell: bash
        run: ./scripts/check-format.sh
