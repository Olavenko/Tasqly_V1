# 🧱 File: .github/workflows/ci/linux.yml
# ---------------------------------
# 📌 Purpose   : Build and test on Linux with PostgreSQL integration
# 🧱 Layer     : CI/CD (GitHub Actions)
# 👤 Author    : Tasqly AI Assistant
# 📅 Created   : 2025-11-18
# 🗓️ Updated   : 2025-11-18
# 📝 Version   : 1.0.0
#
# 🧠 Description:
# - Builds and tests the project on Linux using GCC and Clang
# - Runs PostgreSQL integration tests in a containerized environment
# - Handles database migrations and test data setup
# - Verifies cross-platform compatibility
#
# 🔗 Depends On:
#   - PostgreSQL 17
#   - Qt 6.9.2
#   - GCC/Clang toolchains
#   - Python 3.x
# 🔗 Related   : 
#   - .github/workflows/ci/_main.yml
#   - src/infra/migrations/P1_S2_create_tasks.sql
# ✅ Tested In : GitHub Actions (Ubuntu)
# ⚠️ Errors    : Fails on test/compilation errors or database issues
# ⚡ Performance: Parallel test execution across compiler versions
# 🔒 Security  : Handles database credentials securely

name: Linux Build and Test

on:
  workflow_call:
    inputs:
      postgres-password:
        required: true
        type: string
    secrets:
      PGPASSWORD:
        description: 'PostgreSQL password'
        required: false

jobs:
  build-and-test:
    name: Linux • ${{ matrix.compiler }} • Integration + DB Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ inputs.postgres-password || secrets.PGPASSWORD || 'postgres' }}
          POSTGRES_DB: tasqly_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build clang python3-pip libpq-dev
          cmake --version
          ninja --version

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting..."; sleep 2
          done
          echo "PostgreSQL is ready."

      - name: Show PostgreSQL Environment
        run: |
          printenv | grep PG || true

      - name: Initialize PostgreSQL Schema
        env:
          PGPASSWORD: ${{ inputs.postgres-password || secrets.PGPASSWORD || 'postgres' }}
        run: |
          echo "Applying migration schema to tasqly_test..."
          psql -h localhost -U postgres -d tasqly_test -f src/infra/migrations/P1_S2_create_tasks.sql
          echo "Schema applied successfully."

      - name: Setup Qt 6.9.2
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.9.2
          host: linux
          target: desktop
          cache: false

      - name: Configure Debug (${{ matrix.compiler }})
        run: |
          rm -rf build/${{ matrix.compiler }}-debug
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --preset=gcc-debug -DTASQLY_TEST_PHASE=Phase1
          else
            cmake --preset=clang-debug -DTASQLY_TEST_PHASE=Phase1
          fi

      - name: Build Debug (${{ matrix.compiler }})
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --build --preset=build-gcc-debug --parallel
          else
            cmake --build --preset=build-clang-debug --parallel
          fi

      - name: Run PostgreSQL Integration Tests (${{ matrix.compiler }})
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ${{ inputs.postgres-password || secrets.PGPASSWORD || 'postgres' }}
          PGDATABASE: tasqly_test
        run: |
          echo "Running PostgreSQL Integration Tests..."
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            ctest --preset=test-gcc-debug --output-on-failure 
          else
            ctest --preset=test-clang-debug --output-on-failure
          fi
