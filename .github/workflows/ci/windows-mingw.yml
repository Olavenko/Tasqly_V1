# 🧱 File: .github/workflows/ci/windows-mingw.yml
# ---------------------------------
# 📌 Purpose   : Build and test with MinGW on Windows
# 🧱 Layer     : CI/CD (GitHub Actions)
# 👤 Author    : Tasqly AI Assistant
# 📅 Created   : 2025-11-18
# 🗓️ Updated   : 2025-11-18
# 📝 Version   : 1.0.0
#
# 🧠 Description:
# - Builds and tests the project using MinGW-w64
# - Ensures compatibility with MSYS2 environment
# - Verifies PostgreSQL client integration
# - Runs tests in a MinGW environment
#
# 🔗 Depends On:
#   - MSYS2 with MinGW-w64
#   - Qt 6.9.2 for MinGW
#   - PostgreSQL client libraries
# 🔗 Related   : 
#   - .github/workflows/ci/_main.yml
#   - .github/workflows/ci/windows-msvc.yml
# ✅ Tested In : GitHub Actions (Windows Latest)
# ⚠️ Errors    : Fails on test/compilation errors
# ⚡ Performance: Moderate execution time
# 🔒 Security  : Handles test database credentials

name: Windows MinGW Build and Test

on:
  workflow_call:

jobs:
  build-and-test:
    name: Windows • MinGW • Build + Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-shadertools

      - name: Configure Debug (MinGW)
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          echo "QT_PREFIX=/mingw64" >> $GITHUB_ENV
          rm -rf build/mingw-debug
          cmake --preset=mingw-debug -DTASQLY_TEST_PHASE=Phase1
  
      - name: Build Debug (MinGW)
        shell: msys2 {0}
        run: cmake --build --preset=build-mingw-debug --parallel

      - name: Ensure PostgreSQL Client (for MinGW)
        shell: msys2 {0}
        run: |
          echo "Ensuring PostgreSQL client (libpq.dll) is available..."
          pacman -S --noconfirm mingw-w64-x86_64-postgresql
          ls /mingw64/bin | grep libpq || echo "libpq.dll still missing!"
          echo "PostgreSQL client ensured."

      - name: Run Tests (MinGW Debug)
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          echo "PATH updated with /mingw64/bin"
          ldd build/mingw-debug/TasqlyTestsRunner.exe || true
          ctest --preset=test-mingw-debug --output-on-failure
