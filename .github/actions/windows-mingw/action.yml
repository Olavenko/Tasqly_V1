# 🧱 File: .github/actions/windows-mingw/action.yml
# -------------------------------------------------------------------
# 📌 Purpose      : Build & Test Tasqly on Windows using MinGW (Debug)
# 🧱 Layer        : CI/CD → Windows Build & Testing (Composite Action)
# 👤 Maintainer   : Tasqly AI Assistant
# 🗓️ Created      : 2025-11-03
# 🗓️ Updated      : 2025-11-XX
# 📝 Version      : 1.1.0
#
# 🧠 Description:
#   This composite action performs MinGW-based builds and test execution
#   on Windows using the MSYS2 environment. It provides a lightweight,
#   fast validation layer for Tasqly on the MinGW toolchain, ensuring:
#     • Debug configuration builds cleanly
#     • Qt6 environment is correctly provisioned via MSYS2
#     • PostgreSQL client (libpq.dll) is available
#     • All unit tests execute successfully using CTest
#
# Key Features:
#   • Fully automated MSYS2 environment setup
#   • Configures and builds using CMake presets (mingw-debug)
#   • Verifies PostgreSQL client dependencies
#   • Executes the test suite with proper runtime paths
#
# 🚀 Notes:
#   • Designed for Debug builds only (no Release/Benchmarks here)
#   • Runs after the MSVC job in the main CI pipeline
#   • Provides essential multi-compiler coverage for Windows

name: "Windows MinGW Build and Test"
description: "Fast MinGW build + tests only (no coverage, no benchmarks)"

runs:
  using: "composite"
  steps:

    # ---------------------------------------
    # 1) Checkout
    # ---------------------------------------
    - name: Checkout
      uses: actions/checkout@v4

    # ---------------------------------------
    # 2) Cache MSYS2 Packages
    # ---------------------------------------
    - name: Cache MSYS2 Packages
      uses: actions/cache@v4
      with:
        path: C:\msys64\var\cache\pacman\pkg
        key: ${{ runner.os }}-msys2-pkgcache
        restore-keys: |
          ${{ runner.os }}-msys2-pkgcache

    # ---------------------------------------
    # 3) Setup MSYS2 environment
    # ---------------------------------------
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-declarative
          mingw-w64-x86_64-qt6-shadertools
          mingw-w64-x86_64-postgresql

    # ---------------------------------------
    # 4) Cache Build Directory
    # ---------------------------------------
    - name: Cache MinGW Build
      uses: actions/cache@v4
      with:
        path: build/mingw-debug
        key: ${{ runner.os }}-mingw-build-${{ hashFiles('CMakeLists.txt', 'src/**', 'tests/**') }}
        restore-keys: |
          ${{ runner.os }}-mingw-build-

    # ---------------------------------------
    # 5) Configure Debug (MinGW)
    # ---------------------------------------
    - name: Configure Debug (MinGW)
      shell: msys2 {0}
      run: |
        export PATH="/mingw64/bin:$PATH"
        echo "QT_PREFIX=/mingw64" >> $GITHUB_ENV
        cmake --preset=mingw-debug -DTASQLY_TEST_PHASE=Phase1

    # ---------------------------------------
    # 6) Build Debug
    # ---------------------------------------
    - name: Build Debug (MinGW)
      shell: msys2 {0}
      run: cmake --build --preset=build-mingw-debug --parallel

    # ---------------------------------------
    # 7) Run Tests
    # ---------------------------------------
    - name: Run Tests (MinGW Debug)
      shell: msys2 {0}
      run: |
        export PATH="/mingw64/bin:$PATH"
        ctest --preset=test-mingw-debug --output-on-failure
