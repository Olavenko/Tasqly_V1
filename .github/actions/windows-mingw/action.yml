# 🧱 File: .github/actions/windows-mingw/action.yml
# -------------------------------------------------------------------
# 📌 Purpose      : Build & Test Tasqly on Windows using MinGW (Debug)
# 🧱 Layer        : CI/CD → Windows Build & Testing (Composite Action)
# 👤 Maintainer   : Tasqly AI Assistant
# 🗓️ Updated      : 2025-11-XX
# 📝 Version      : 1.2.0
#
# 🧠 Description:
#   Lightweight MinGW CI pipeline with full MSYS2 package caching
#   and clear logging for cache hit/miss detection. Always performs
#   a clean Debug build (no build caching).
#
# Key Features:
#   • MSYS2 package caching (heavy step)
#   • Logs cache hit/miss explicitly
#   • Clean builds every run
#   • MinGW Debug + Test via presets

name: "Windows MinGW Build and Test"
description: "MinGW Debug build + tests with MSYS2 caching and full cache logging"

runs:
  using: "composite"
  steps:

    # ---------------------------------------
    # 1) Checkout
    # ---------------------------------------
    - name: Checkout
      uses: actions/checkout@v4

    # ---------------------------------------
    # 2) Cache MSYS2 Packages
    # ---------------------------------------
    - name: Cache MSYS2 Packages
      id: cache_msys
      uses: actions/cache@v4
      with:
        path: C:\msys64\var\cache\pacman\pkg
        key: ${{ runner.os }}-msys2-pkgcache-v2
        restore-keys: |
          ${{ runner.os }}-msys2-pkgcache-

    # ---------------------------------------
    # 3) Log Cache Result (MSYS2)
    # ---------------------------------------
    - name: Log MSYS2 Cache Result
      shell: bash
      run: |
        if [ "${{ steps.cache_msys.outputs.cache-hit }}" = "true" ]; then
          echo "✔ MSYS2 Cache Restored Successfully (HIT)"
        else
          echo "✘ MSYS2 Cache MISS — Full MSYS2 installation will run"
        fi

    # ---------------------------------------
    # 4) Setup MSYS2 environment
    # ---------------------------------------
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-declarative
          mingw-w64-x86_64-qt6-shadertools
          mingw-w64-x86_64-postgresql

    # ---------------------------------------
    # 5) Configure Debug (MinGW)
    # ---------------------------------------
    - name: Configure Debug (MinGW)
      shell: msys2 {0}
      run: |
        export PATH="/mingw64/bin:$PATH"
        echo "QT_PREFIX=/mingw64" >> $GITHUB_ENV
        cmake --preset=mingw-debug -DTASQLY_TEST_PHASE=Phase1

    # ---------------------------------------
    # 6) Build Debug
    # ---------------------------------------
    - name: Build Debug (MinGW)
      shell: msys2 {0}
      run: cmake --build --preset=build-mingw-debug --parallel

    # ---------------------------------------
    # 7) Run Tests
    # ---------------------------------------
    - name: Run Tests (MinGW Debug)
      shell: msys2 {0}
      run: |
        export PATH="/mingw64/bin:$PATH"
        ctest --preset=test-mingw-debug --output-on-failure
