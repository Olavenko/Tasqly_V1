name: Setup CMake and Ninja

description: |-
  Downloads and caches portable CMake and Ninja toolchains so builds can rely on
  consistent versions across runners and workflows.

inputs:
  cmake-version:
    description: Exact CMake version to install (e.g., 3.29.6).
    default: '3.29.6'
  ninja-version:
    description: Ninja release version.
    default: '1.11.1'

outputs:
  cmake-bin:
    description: Absolute path to the cmake executable.
    value: ${{ steps.finalize.outputs.cmake-bin }}
  ninja-bin:
    description: Absolute path to the ninja executable.
    value: ${{ steps.finalize.outputs.ninja-bin }}

runs:
  using: composite
  steps:
    - name: Prepare directories
      id: dirs
      shell: bash
      run: |
        ROOT="${{ github.workspace }}/.deps"
        CMAKE_DIR="$ROOT/cmake/${{ runner.os }}"
        NINJA_DIR="$ROOT/ninja/${{ runner.os }}"
        mkdir -p "$CMAKE_DIR" "$NINJA_DIR"
        echo "cmake-dir=$CMAKE_DIR" >> "$GITHUB_OUTPUT"
        echo "ninja-dir=$NINJA_DIR" >> "$GITHUB_OUTPUT"

    - name: Cache CMake/Ninja
      id: cmake-cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.dirs.outputs.cmake-dir }}
          ${{ steps.dirs.outputs.ninja-dir }}
        key: ${{ runner.os }}-cmake-${{ inputs.cmake-version }}-ninja-${{ inputs.ninja-version }}

    - name: Install CMake on Linux
      if: ${{ runner.os == 'Linux' && steps.cmake-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.cmake-version }}"
        ARCHIVE="cmake-${VERSION}-linux-x86_64.tar.gz"
        URL="https://github.com/Kitware/CMake/releases/download/v${VERSION}/${ARCHIVE}"
        curl -sSL "$URL" -o cmake.tgz
        tar --strip-components=1 -xzf cmake.tgz -C "${{ steps.dirs.outputs.cmake-dir }}"
        rm cmake.tgz
        mkdir -p "${{ steps.dirs.outputs.ninja-dir }}"
        NINJA_URL="https://github.com/ninja-build/ninja/releases/download/v${{ inputs.ninja-version }}/ninja-linux.zip"
        curl -sSL "$NINJA_URL" -o ninja.zip
        unzip -qo ninja.zip -d "${{ steps.dirs.outputs.ninja-dir }}"
        rm ninja.zip
        chmod +x "${{ steps.dirs.outputs.ninja-dir }}/ninja"

    - name: Install CMake on Windows
      if: ${{ runner.os == 'Windows' && steps.cmake-cache.outputs.cache-hit != 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = '${{ inputs.cmake-version }}'
        $archive = "cmake-$version-windows-x86_64.zip"
        $url = "https://github.com/Kitware/CMake/releases/download/v$version/$archive"
        Invoke-WebRequest -Uri $url -OutFile cmake.zip
        Expand-Archive -Path cmake.zip -DestinationPath temp-cmake
        Copy-Item -Path "temp-cmake/cmake-$version-windows-x86_64/*" -Destination "${{ steps.dirs.outputs.cmake-dir }}" -Recurse -Force
        Remove-Item cmake.zip
        Remove-Item temp-cmake -Recurse -Force
        New-Item -ItemType Directory -Force -Path "${{ steps.dirs.outputs.ninja-dir }}" | Out-Null
        $ninjaUrl = "https://github.com/ninja-build/ninja/releases/download/v${{ inputs.ninja-version }}/ninja-win.zip"
        Invoke-WebRequest -Uri $ninjaUrl -OutFile ninja.zip
        Expand-Archive -Path ninja.zip -DestinationPath "${{ steps.dirs.outputs.ninja-dir }}"
        Remove-Item ninja.zip

    - name: Finalize CMake/Ninja environment
      id: finalize
      shell: bash
      run: |
        CMAKE_BIN="${{ steps.dirs.outputs.cmake-dir }}/bin/cmake"
        NINJA_BIN="${{ steps.dirs.outputs.ninja-dir }}/ninja"
        if [ "${{ runner.os }}" = "Windows" ]; then
          CMAKE_BIN="${{ steps.dirs.outputs.cmake-dir }}/bin/cmake.exe"
          NINJA_BIN="${{ steps.dirs.outputs.ninja-dir }}/ninja.exe"
        fi
        echo "$CMAKE_BIN" >> "$GITHUB_PATH"
        echo "$(dirname "$NINJA_BIN")" >> "$GITHUB_PATH"
        echo "cmake-bin=$CMAKE_BIN" >> "$GITHUB_OUTPUT"
        echo "ninja-bin=$NINJA_BIN" >> "$GITHUB_OUTPUT"
