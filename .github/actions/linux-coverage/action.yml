# 🧱 File: .github/actions/linux-coverage/action.yml
# ---------------------------------------------------------------------------
# 📌 Purpose      : Generate LCOV coverage report (info + HTML)
# 🧱 Layer        : CI/CD → Linux Coverage
# 👤 Maintainer   : Tasqly AI Assistant
# 🗓️ Created      : 2025-11-19
# 🗓️ Updated      : 2025-11-21
# 📝 Version      : 1.1.0
#
# 🧠 Description:
#   Full GCC coverage pipeline:
#     • Build coverage-enabled targets using CMake presets
#     • Run PostgreSQL-backed test suite
#     • Capture LCOV coverage.info
#     • Produce full HTML dashboard using genhtml
#     • Upload final artifacts for CI insights
#
# Key Features:
#   • Qt caching enabled (fast CI performance)
#   • Clean builds only (no build caching)
#   • Pretty LCOV summary in CI logs
#   • HTML report artifact for download
#
# 🚀 Notes:
#   • PostgreSQL service must be provided by the workflow
#   • No build directory caching (required for gcov correctness)
#   • No apt caching (unsupported on GitHub)
# ---------------------------------------------------------------------------

name: "Linux Coverage Report"
description: "Run GCC coverage build, generate LCOV+HTML report, upload artifacts"

inputs:
  pgpassword:
    description: "PostgreSQL password passed from workflow"
    required: true
    type: string

runs:
  using: "composite"
  steps:

    # -----------------------
    # 1) Checkout
    # -----------------------
    - name: Checkout
      uses: actions/checkout@v4

    # ----------------------------------------------
    # 2) Install deps (apt — NOT cached)
    # ----------------------------------------------
    - name: Install coverage dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          lcov \
          build-essential \
          ninja-build \
          libpq-dev \
          gcc g++

    # ---------------------------
    # 3) Setup Qt 6.9.2 (cached)
    # ---------------------------
    - name: Setup Qt 6.9.2
      id: qt_setup
      uses: jurplel/install-qt-action@v3
      with:
        version: 6.9.2
        host: linux
        target: desktop
        cache: true

    # ---------------------------
    # 4) Log Qt Cache Result
    # ---------------------------
    - name: Log Qt Cache Result
      shell: bash
      run: |
        if [ "${{ steps.qt_setup.outputs.cache-hit }}" = "true" ]; then
          echo "✔ Qt Cache Restored "
        else
          echo "✘ Qt Cache MISS — Qt will download now"
        fi

    # ---------------------------
    # 5) Wait for PostgreSQL
    # ---------------------------
    - name: Wait for PostgreSQL
      shell: bash
      run: |
        for i in {1..20}; do
          pg_isready -h localhost -p 5432 -U postgres && break
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        echo "PostgreSQL is ready."

    # -------------------------------------
    # 6) Configure GCC Coverage build
    # -------------------------------------
    - name: Configure Coverage (gcc)
      shell: bash
      run: |
        cmake --preset=gcc-coverage -DTASQLY_TEST_PHASE=Phase1

    # -----------------------
    # 7) Build
    # -----------------------
    - name: Build Coverage (gcc)
      shell: bash
      run: |
        cmake --build --preset=build-gcc-coverage --parallel

    # -----------------------
    # 8) Run Tests
    # -----------------------
    - name: Run Tests (gcc coverage)
      shell: bash
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: postgres
        PGPASSWORD: ${{ inputs.pgpassword }}
        PGDATABASE: tasqly_test
      run: |
        ctest --preset=test-gcc-coverage --output-on-failure

    # ------------------------
    # 9) Capture LCOV data
    # ------------------------
    - name: Generate coverage.info
      shell: bash
      run: |
        mkdir -p coverage
        lcov --capture \
             --directory . \
             --output-file coverage/coverage.info \
             --rc branch_coverage=1 \
             --ignore-errors mismatch \
             --ignore-errors unused \
             --exclude '/usr/include/*' \
             --exclude '/usr/lib/*' \
             --exclude '/usr/local/*' \
             --exclude '*/external/*' \
             --exclude '*/externals/*' \
             --exclude '*/_deps/*' \
             --exclude '*/googletest-src/*' \
             --exclude '*/gtest/*' \
             --exclude '*/Qt/*' \
             --exclude '*/Qt6/*' \
             --exclude '*/QtCore/*' \
             --exclude '*/tests/*' \
             --exclude '*/build/*'

    # ---------------------------------
    # 10) Pretty Coverage Summary
    # ---------------------------------
    - name: Coverage Summary (Pretty)
      shell: bash
      run: |
        echo "📊 **LCOV Coverage Summary**"
        echo "-------------------------------------"
        lcov --summary coverage/coverage.info | grep -E "lines|functions|branches"

    # ---------------------------------
    # 11) Generate HTML Report
    # ---------------------------------
    - name: Generate HTML coverage report
      shell: bash
      run: |
        genhtml coverage/coverage.info \
                --output-directory coverage_html \
                --branch-coverage

    # ----------------------------------------------
    # 12) Upload artifacts (coverage.info + HTML)
    # ----------------------------------------------
    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage/coverage.info
          coverage_html/
