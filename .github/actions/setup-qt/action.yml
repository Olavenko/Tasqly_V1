name: "Setup Qt"
description: "Installs Qt via install-qt-action and configures environment variables."

inputs:
  version:
    description: "Qt version to install."
    required: false
    default: "6.9.2"

  host:
    description: "Host platform (linux, windows, mac)."
    required: false
    default: "linux"

  target:
    description: "Qt target (desktop, android, etc.)."
    required: false
    default: "desktop"

  arch:
    description: "Qt architecture directory (gcc_64, win64_msvc2022_64, win64_mingw)."
    required: false
    default: "gcc_64"

  dir:
    description: "Installation directory."
    required: false
    default: "${{ github.workspace }}/Qt"

  modules:
    description: "Optional space separated Qt modules."
    required: false
    default: ""

  fallback-version:
    description: "Fallback version if primary fails."
    required: false
    default: "6.8.0"


outputs:
  qt-root:
    value: ${{ steps.resolved.outputs.qt-dir }}
  qt-bin:
    value: ${{ steps.paths.outputs.qt-bin || steps.paths-win.outputs.qt-bin }}
  cmake-prefix:
    value: ${{ steps.paths.outputs.cmake-prefix || steps.paths-win.outputs.cmake-prefix }}
  qml-path:
    value: ${{ steps.paths.outputs.qml-path || steps.paths-win.outputs.qml-path }}


runs:
  using: "composite"
  steps:

    # ========================
    # 🔍 DEBUG
    # ========================
    - name: DEBUG INPUTS
      shell: bash
      run: |
        echo ">>> version  = '${{ inputs.version }}'"
        echo ">>> fallback = '${{ inputs['fallback-version'] }}'"
        echo ">>> host     = '${{ inputs.host }}'"
        echo ">>> target   = '${{ inputs.target }}'"
        echo ">>> arch     = '${{ inputs.arch }}'"
        echo ">>> dir      = '${{ inputs.dir }}'"
        echo ">>> modules  = '${{ inputs.modules }}'"

    # ================================
    # 💡 Skip installation on MinGW
    # ================================
    - name: Skip install for MinGW (MSYS2 provides Qt)
      if: inputs.arch == 'win64_mingw'
      shell: bash
      run: |
        echo "MinGW detected — skipping Qt installation."
        echo "qt-dir=/mingw64" >> "$GITHUB_OUTPUT"

    # ================================
    # 🧩 Install Qt (Primary)
    # ================================
    - name: Install Qt (Primary)
      id: qt-primary
      if: inputs.arch != 'win64_mingw'
      continue-on-error: true
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ inputs.version }}
        host: ${{ inputs.host }}
        target: ${{ inputs.target }}
        arch: ${{ inputs.arch }}
        dir: ${{ inputs.dir }}
        modules: ${{ inputs.modules }}
        cache: true

    # ================================
    # 🧩 Install Qt (Fallback)
    # ================================
    - name: Install Qt (Fallback)
      id: qt-fallback
      if: inputs.arch != 'win64_mingw' && steps.qt-primary.outcome != 'success'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ inputs['fallback-version'] }}
        host: ${{ inputs.host }}
        target: ${{ inputs.target }}
        arch: ${{ inputs.arch }}
        dir: ${{ inputs.dir }}
        modules: ${{ inputs.modules }}
        cache: true

    # ================================
    # ❌ Verify failure
    # ================================
    - name: Verify Qt installation
      if: inputs.arch != 'win64_mingw' && steps.qt-primary.outcome != 'success' && steps.qt-fallback.outcome != 'success'
      shell: bash
      run: |
        echo "::error::Failed to install Qt version '${{ inputs.version }}' & fallback '${{ inputs['fallback-version'] }}'."
        exit 1

    # ================================
    # 🔍 Resolve Qt root
    # ================================
    - name: Resolve Qt root
      id: resolved
      shell: bash
      run: |
        if [ "${{ inputs.arch }}" = "win64_mingw" ]; then
          qt_dir="/mingw64"
        else
          qt_dir="${Qt6_DIR:-${Qt5_DIR:-${QT_ROOT_DIR:-}}}"
        fi

        if [ -z "$qt_dir" ]; then
          echo "::error::Qt installation path not detected."
          echo "Available ENV:"
          env | grep -i qt || true
          exit 1
        fi

        echo "qt-dir=$qt_dir" >> "$GITHUB_OUTPUT"
        echo ">>> Resolved Qt Root: $qt_dir"

    # ================================
    # 🐧 POSIX Path Derivation
    # ================================
    - name: Derive Qt paths (POSIX)
      id: paths
      if: runner.os != 'Windows'
      shell: bash
      env:
        QT_DIR: ${{ steps.resolved.outputs.qt-dir }}
      run: |
        arch="${{ inputs.arch }}"
        if [ "$arch" = "win64_mingw" ]; then arch=""; fi

        qt_dir="${QT_DIR}"
        bin="${qt_dir}/${arch}/bin"
        cmake_prefix="${qt_dir}/${arch}/lib/cmake/Qt6"
        qml_path="${qt_dir}/${arch}/qml"

        echo "QT_ROOT=$qt_dir" >> "$GITHUB_ENV"
        echo "$bin" >> "$GITHUB_PATH"
        echo "CMAKE_PREFIX_PATH=$cmake_prefix" >> "$GITHUB_ENV"
        echo "qt-bin=$bin" >> "$GITHUB_OUTPUT"
        echo "cmake-prefix=$cmake_prefix" >> "$GITHUB_OUTPUT"
        echo "qml-path=$qml_path" >> "$GITHUB_OUTPUT"

    # ================================
    # 🪟 Windows Path Derivation
    # ================================
    - name: Derive Qt paths (Windows)
      id: paths-win
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        QT_DIR: ${{ steps.resolved.outputs.qt-dir }}
      run: |
        $qtDir = $env:QT_DIR
        $arch  = '${{ inputs.arch }}'

        if ($arch -eq 'win64_mingw') {
          $bin = "C:\msys64\mingw64\bin"
          $cmakePrefix = ""
          $qmlPath = ""
        } else {
          $archRoot    = Join-Path $qtDir $arch
          $bin         = Join-Path $archRoot "bin"
          $cmakePrefix = Join-Path $archRoot "lib\cmake\Qt6"
          $qmlPath     = Join-Path $archRoot "qml"
        }

        "QT_ROOT=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $bin           | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "qt-bin=$bin"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "cmake-prefix=$cmakePrefix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "qml-path=$qmlPath"         | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
