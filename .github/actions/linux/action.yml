# 🧱 File: .github/actions/linux/action.yml
# ---------------------------------------------------------------------------
# 📌 Purpose      : Build & Test Tasqly on Linux using GCC/Clang
# 🧱 Layer        : CI/CD → Build & Integration Testing (Composite Action)
# 👤 Maintainer   : Tasqly AI Assistant
# 🗓️ Created      : 2025-11-03
# 🗓️ Updated      : 2025-11-XX
# 📝 Version      : 1.2.0
#
# 🧠 Description:
#   Performs full Linux builds (GCC & Clang) including:
#     • Toolchain + dependency installation
#     • PostgreSQL schema preparation
#     • Debug build using presets (gcc-debug / clang-debug)
#     • Full unit + integration test execution
#     • Qt installation with caching for fast CI performance
#
# Key Features:
#   • GCC / Clang switch via inputs.compiler
#   • PostgreSQL-backed integration test suite
#   • Clean reproducible builds (no build caching)
#   • Qt caching + HIT/MISS logging
#
# 🚀 Notes:
#   • PostgreSQL service must be declared at workflow level
#   • No apt/pip caching (unsupported)
#   • No build caching (debug/integration requires clean builds)
# ---------------------------------------------------------------------------

name: "Linux GCC/Clang Integration & DB Tests"
description: "Build Tasqly on Linux using GCC/Clang and run PostgreSQL integration tests"

inputs:
  compiler:
    description: "Compiler to use (gcc or clang)"
    required: true
    type: string

  pgpassword:
    description: "PostgreSQL password passed from workflow"
    required: true
    type: string

runs:
  using: "composite"
  steps:

    # ---------------------------------------
    # 1) Checkout source code
    # ---------------------------------------
    - name: Checkout
      uses: actions/checkout@v4

    # ---------------------------------------
    # 2) Install dependencies (apt — no cache)
    # ---------------------------------------
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential ninja-build clang python3-pip libpq-dev
        cmake --version
        ninja --version

    # ---------------------------------------
    # 3) Wait for PostgreSQL to become ready
    # ---------------------------------------
    - name: Wait for PostgreSQL
      shell: bash
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        for i in {1..20}; do
          pg_isready -h localhost -p 5432 -U postgres && break
          echo "Waiting..."; sleep 2
        done
        echo "PostgreSQL is ready."

    # ---------------------------------------
    # 4) Show PostgreSQL Environment
    # ---------------------------------------
    - name: Show PostgreSQL Environment
      shell: bash
      run: |
        printenv | grep PG || true

    # ---------------------------------------
    # 5) Apply DB Schema Migration
    # ---------------------------------------
    - name: Initialize PostgreSQL Schema
      shell: bash
      env:
        PGPASSWORD: ${{ inputs.pgpassword }}
      run: |
        echo "Applying migration schema to tasqly_test..."
        psql -h localhost -U postgres -d tasqly_test \
             -f src/infra/migrations/P1_S2_create_tasks.sql
        echo "Schema applied successfully."

    # ---------------------------------------
    # 6) Setup Qt 6.9.2 w/ cache
    # ---------------------------------------
    - name: Setup Qt 6.9.2
      id: qt_setup
      uses: jurplel/install-qt-action@v3
      with:
        version: 6.9.2
        host: linux
        target: desktop
        cache: true

    # ---------------------------------------
    # 7) Log Qt Cache Result
    # ---------------------------------------
    - name: Log Qt Cache Result
      shell: bash
      run: |
        if [ "${{ steps.qt_setup.outputs.cache-hit }}" = "true" ]; then
          echo "✔ Qt Cache Restored (HIT)"
        else
          echo "✘ Qt Cache MISS — Qt will download now"
        fi

    # ---------------------------------------
    # 8) Configure Debug Build
    # ---------------------------------------
    - name: Configure Debug Build (${{ inputs.compiler }})
      shell: bash
      run: |
        rm -rf build/${{ inputs.compiler }}-debug
        if [ "${{ inputs.compiler }}" = "gcc" ]; then
          cmake --preset=gcc-debug -DTASQ﻿LY_TEST_PHASE=Phase1
        else
          cmake --preset=clang-debug -DTASQ﻿LY_TEST_PHASE=Phase1
        fi

    # ---------------------------------------
    # 9) Build Debug
    # ---------------------------------------
    - name: Build Debug (${{ inputs.compiler }})
      shell: bash
      run: |
        if [ "${{ inputs.compiler }}" = "gcc" ]; then
          cmake --build --preset=build-gcc-debug --parallel
        else
          cmake --build --preset=build-clang-debug --parallel
        fi

    # ---------------------------------------
    # 10) Run ALL Tests
    # ---------------------------------------
    - name: Run PostgreSQL Integration Tests (${{ inputs.compiler }})
      shell: bash
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: postgres
        PGPASSWORD: ${{ inputs.pgpassword }}
        PGDATABASE: tasqly_test
      run: |
        echo "Running PostgreSQL Integration Tests..."
        if [ "${{ inputs.compiler }}" = "gcc" ]; then
          ctest --preset=test-gcc-debug --output-on-failure
        else
          ctest --preset=test-clang-debug --output-on-failure
        fi
