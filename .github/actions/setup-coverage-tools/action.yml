name: Setup Coverage Tooling

description: |-
  Installs coverage toolchains (gcovr, lcov) and Python dependencies used by
  reporting scripts, emitting an output flag when everything is ready.

outputs:
  coverage-ready:
    description: 'true' when coverage dependencies are installed.'
    value: ${{ steps.coverage-ready.outputs.coverage-ready }}

runs:
  using: composite
  steps:
    - name: Determine pip cache directory
      id: pip-cache
      shell: bash
      run: |
        CACHE_DIR="$(python -m pip cache dir)"
        echo "dir=$CACHE_DIR" >> "$GITHUB_OUTPUT"

    - name: Cache pip deps for coverage tools
      uses: actions/cache@v4
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key: ${{ runner.os }}-coverage-python-${{ hashFiles('scripts/**.py') }}
        restore-keys: |
          ${{ runner.os }}-coverage-python-

    - name: Install coverage packages
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install gcovr lcov_cobertura plotly pandas

    - name: Cache lcov apt packages (Linux)
      if: ${{ runner.os == 'Linux' }}
      uses: actions/cache@v4
      with:
        path: |
          /var/cache/apt/archives
          /var/lib/apt/lists
        key: ${{ runner.os }}-coverage-lcov

    - name: Install lcov on Linux
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov

    - name: Mark coverage environment ready
      id: coverage-ready
      shell: bash
      run: |
        echo "coverage-ready=true" >> "$GITHUB_OUTPUT"
