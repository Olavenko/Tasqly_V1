# 🧱 File: .github/actions/linux-benchmarks/action.yml
# ---------------------------------------------------------------------------
# 📌 Purpose      : Run Google Benchmark on Linux (GCC + Clang)
# 🧱 Layer        : CI/CD → Performance Benchmarks
# 👤 Maintainer   : Tasqly AI Assistant
# 🗓️ Created      : 2025-11-19
# 🗓️ Updated      : 2025-11-21
# 📝 Version      : 1.1.0
#
# 🧠 Description:
#   Release-mode benchmarking pipeline using GCC or Clang.
#   Steps:
#     • Install toolchain + Python libraries
#     • Setup Qt (cached)
#     • Configure + Build Release presets
#     • Run Tasqly benchmark generator
#     • Upload full benchmark JSON/MD/HTML artifacts
#
# Key Features:
#   • Qt caching enabled for fast CI runs
#   • Clean Release builds (no build caching)
#   • Python report generator included
#   • Unified logging (Qt HIT/MISS)
#
# 🚀 Notes:
#   • No build directory cache (benchmark binaries must be fresh)
#   • No apt or pip caching (unstable/unsupported on GitHub)
# ---------------------------------------------------------------------------

name: "Linux Benchmarks"
description: "Run GCC/Clang Release benchmarks and upload reports"

inputs:
  compiler:
    description: "Compiler to use (gcc or clang)"
    required: true
    type: string

runs:
  using: "composite"
  steps:

    # ---------------------------
    # 1) Checkout
    # ---------------------------
    - name: Checkout
      uses: actions/checkout@v4

    # ---------------------------
    # 2) Install Dependencies
    # ---------------------------
    - name: Install GCC/Clang + Tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc g++ clang ninja-build python3 python3-pip

    # ---------------------------
    # 3) Install Python Libraries
    # ---------------------------
    - name: Install Python Tools
      shell: bash
      run: |
        pip install --upgrade pip
        pip install pandas plotly

    # ---------------------------
    # 4) Setup Qt 6.9.2 (cached)
    # ---------------------------
    - name: Setup Qt 6.9.2
      id: qt_setup
      uses: jurplel/install-qt-action@v3
      with:
        version: 6.9.2
        host: linux
        target: desktop
        cache: true

    # ---------------------------
    # 5) Log Qt Cache Result
    # ---------------------------
    - name: Log Qt Cache Result
      shell: bash
      run: |
        if [ "${{ steps.qt_setup.outputs.cache-hit }}" = "true" ]; then
          echo "✔ Qt Cache Restored (HIT)"
        else
          echo "✘ Qt Cache MISS — Qt will download now"
        fi

    # ---------------------------
    # 6) Configure Release Benchmarks
    # ---------------------------
    - name: Configure Benchmarks (${{ inputs.compiler }})
      shell: bash
      run: |
        if [ "${{ inputs.compiler }}" = "gcc" ]; then
          cmake --preset=gcc-benchmarks-release \
                -DTASQLY_BENCHMARK_PHASE=Phase1
        else
          cmake --preset=clang-benchmarks-release \
                -DTASQLY_BENCHMARK_PHASE=Phase1
        fi

    # ---------------------------
    # 7) Build Benchmarks
    # ---------------------------
    - name: Build Benchmarks (${{ inputs.compiler }})
      shell: bash
      run: |
        if [ "${{ inputs.compiler }}" = "gcc" ]; then
          cmake --build --preset=build-gcc-benchmarks-release --parallel
        else
          cmake --build --preset=build-clang-benchmarks-release --parallel
        fi

    # ---------------------------
    # 8) Run the Benchmark Suite
    # ---------------------------
    - name: Run Tasqly Benchmarks (${{ inputs.compiler }})
      shell: bash
      run: |
        python scripts/run_benchmarks.py \
          --phase Phase1 \
          --compiler ${{ inputs.compiler }} \
          --format all \
          --quiet

    # ---------------------------
    # 9) Upload Benchmark Reports
    # ---------------------------
    - name: Upload Benchmark Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-benchmarks-${{ inputs.compiler }}
        path: |
          reports/benchmarks/**/*
