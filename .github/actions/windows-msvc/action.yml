# 🧱 File: .github/actions/windows-msvc/action.yml
# ---------------------------------------------------------------------------
# 📌 Purpose      : MSVC Debug Build + Tests with Cache Logging
# 🧱 Layer        : CI/CD → Windows Build Pipeline (Composite Action)
# 👤 Maintainer   : Tasqly AI Assistant
# 🗓️ Updated      : 2025-11-XX
# 📝 Version      : 1.2.0
#
# 🧠 Description:
#   MSVC build pipeline with explicit logging for all cached components:
#     • Ninja tool cache (actions/cache)
#     • Qt 6.9.2 cache (install-qt-action)
#   Always performs clean builds (no build directory cache).
#
# Key Features:
#   • MSVC Dev Environment
#   • Ninja Cache + Log
#   • Qt Cache + Log
#   • Clean Debug build + tests

name: "Windows MSVC Build and Test"
description: "MSVC Debug build + tests with full cache logging"

runs:
  using: "composite"
  steps:

    # ---------------------------------------
    # 1) Checkout
    # ---------------------------------------
    - name: Checkout
      uses: actions/checkout@v4

    # ---------------------------------------
    # 2) Setup MSVC Dev Environment
    # ---------------------------------------
    - name: Setup MSVC Dev Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # ---------------------------------------
    # 3) Cache Ninja
    # ---------------------------------------
    - name: Cache Ninja
      id: ninja_cache
      uses: actions/cache@v4
      with:
        path: C:\ProgramData\chocolatey\bin\ninja.exe
        key: ${{ runner.os }}-ninja-cache-v2
        restore-keys: |
          ${{ runner.os }}-ninja-cache-

    # ---------------------------------------
    # 4) Log Ninja Cache Result
    # ---------------------------------------
    - name: Log Ninja Cache Result
      shell: powershell
      run: |
        if ("${{ steps.ninja_cache.outputs.cache-hit }}" -eq "true") {
          echo "✔ Ninja Cache Restored "
        } else {
          echo "✘ Ninja Cache MISS — Ninja may be reinstalled"
        }

    # ---------------------------------------
    # 5) Setup Qt 6.9.2 (with caching)
    # ---------------------------------------
    - name: Setup Qt 6.9.2 (MSVC)
      id: qt_setup
      uses: jurplel/install-qt-action@v3
      with:
        version: 6.9.2
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        cache: true

    # ---------------------------------------
    # 6) Log Qt Cache Result
    # ---------------------------------------
    - name: Log Qt Cache Result
      shell: powershell
      run: |
        if ("${{ steps.qt_setup.outputs.cache-hit }}" -eq "true") {
          echo "✔ Qt Cache Restored "
        } else {
          echo "✘ Qt Cache MISS — Qt will download now"
        }

    # ---------------------------------------
    # 7) Configure (Debug)
    # ---------------------------------------
    - name: Configure MSVC Debug
      shell: powershell
      run: >
        cmake --preset=msvc-debug
        -DTASQLY_TEST_PHASE=Phase1

    # ---------------------------------------
    # 8) Build
    # ---------------------------------------
    - name: Build (MSVC Debug)
      shell: powershell
      run: cmake --build --preset=build-msvc-debug --parallel

    # ---------------------------------------
    # 9) Run Tests
    # ---------------------------------------
    - name: Run Tests (MSVC)
      shell: powershell
      run: ctest --preset=test-msvc-debug --output-on-failure
