name: "Setup Python"
description: "Configures Python and installs optional dependencies."
inputs:
  python-version:
    description: "Python version specification."
    required: false
    default: "3.13"
  requirements-file:
    description: "Optional requirements file to install."
    required: false
    default: ""
  extra-packages:
    description: "Space separated python packages to install."
    required: false
    default: ""
outputs:
  python-path:
    description: "Path to the installed interpreter."
    value: ${{ steps.python.outputs.python-path }}
  pip-cache-hit:
    description: "Cache hit for pip dependencies."
    value: ${{ steps.pip-cache.outputs.cache-hit }}
runs:
  using: "composite"
  steps:
    - name: Setup Python
      id: python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
    - name: Prime pip cache
      id: pip-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ inputs.requirements-file != '' && hashFiles(inputs.requirements-file) || 'none' }}
    - name: Upgrade pip
      shell: bash
      run: python -m pip install --upgrade pip
    - name: Install requirements file
      if: inputs.requirements-file != ''
      shell: bash
      run: |
        if [ -f "${{ inputs.requirements-file }}" ]; then
          python -m pip install -r "${{ inputs.requirements-file }}"
        else
          echo "Requirements file ${{ inputs.requirements-file }} not found" >&2
          exit 1
        fi
    - name: Install extra packages
      if: inputs.extra-packages != ''
      shell: bash
      run: python -m pip install ${{ inputs.extra-packages }}
    - name: Export Python path (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "PYTHONPATH=${{ github.workspace }}/scripts:$PYTHONPATH" >> "$GITHUB_ENV"
    - name: Export Python path (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "PYTHONPATH=${{ github.workspace }}\\scripts;$env:PYTHONPATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
