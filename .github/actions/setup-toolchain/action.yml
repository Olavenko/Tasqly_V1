name: "Setup Toolchain"
description: "Installs compiler toolchains and exports common build environment variables."
inputs:
  compiler:
    description: "Compiler family to configure (gcc, clang, msvc, mingw)."
    required: true
  needs-ninja:
    description: "Install Ninja when true."
    required: false
    default: "true"
  enable-sanitizers:
    description: "Install sanitizer dependencies when true."
    required: false
    default: "false"
  toolchain-file:
    description: "Optional CMake toolchain file path."
    required: false
    default: ""
outputs:
  cc:
    description: "C compiler executable."
    value: ${{ steps.meta-posix.outputs.cc || steps.meta-win.outputs.cc }}
  cxx:
    description: "C++ compiler executable."
    value: ${{ steps.meta-posix.outputs.cxx || steps.meta-win.outputs.cxx }}
  generator:
    description: "Preferred CMake generator."
    value: Ninja
  toolchain-file:
    description: "Resolved CMake toolchain file."
    value: ${{ steps.meta-posix.outputs.toolchain-file || steps.meta-win.outputs.toolchain-file }}
  cache-key-fragment:
    description: "Cache key fragment to reuse across build steps."
    value: ${{ steps.meta-posix.outputs.cache-key || steps.meta-win.outputs.cache-key }}
runs:
  using: "composite"
  steps:
    - name: Install GCC toolchain (Linux)
      if: runner.os == 'Linux' && inputs.compiler == 'gcc'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build ccache libpq-dev
        if [[ "${{ inputs.enable-sanitizers }}" == "true" ]]; then
          sudo apt-get install -y libasan8 libubsan1
        fi
    - name: Install Clang toolchain (Linux)
      if: runner.os == 'Linux' && inputs.compiler == 'clang'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang build-essential ninja-build ccache libpq-dev
        if [[ "${{ inputs.enable-sanitizers }}" == "true" ]]; then
          sudo apt-get install -y llvm
        fi
    - name: Setup MSVC developer command prompt
      if: runner.os == 'Windows' && inputs.compiler == 'msvc'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Ensure Ninja (Windows)
      if: runner.os == 'Windows' && inputs.needs-ninja == 'true'
      shell: pwsh
      run: |
        if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
          choco install ninja --no-progress -y
        }
        ninja --version
    - name: Setup MSYS2 for MinGW
      if: runner.os == 'Windows' && inputs.compiler == 'mingw'
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-declarative
          mingw-w64-x86_64-qt6-shadertools
          mingw-w64-x86_64-postgresql
    - name: Export toolchain metadata (POSIX)
      id: meta-posix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        compiler="${{ inputs.compiler }}"
        toolchain="${{ inputs.toolchain-file }}"
        case "$compiler" in
          gcc)
            cc="gcc"
            cxx="g++"
            ;;
          clang)
            cc="clang"
            cxx="clang++"
            ;;
          *)
            cc="${compiler}"
            cxx="${compiler}++"
            ;;
        esac
        echo "CC=$cc" >> "$GITHUB_ENV"
        echo "CXX=$cxx" >> "$GITHUB_ENV"
        echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
        if [[ -n "$toolchain" ]]; then
          echo "CMAKE_TOOLCHAIN_FILE=$toolchain" >> "$GITHUB_ENV"
        fi
        echo "cc=$cc" >> "$GITHUB_OUTPUT"
        echo "cxx=$cxx" >> "$GITHUB_OUTPUT"
        echo "toolchain-file=$toolchain" >> "$GITHUB_OUTPUT"
        echo "cache-key=${{ runner.os }}-${{ inputs.compiler }}" >> "$GITHUB_OUTPUT"
    - name: Export toolchain metadata (Windows)
      id: meta-win
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $compiler = '${{ inputs.compiler }}'
        $toolchain = '${{ inputs.toolchain-file }}'
        if ($compiler -eq 'msvc') {
          $cc = 'cl'
          $cxx = 'cl'
        } elseif ($compiler -eq 'mingw') {
          $cc = 'gcc'
          $cxx = 'g++'
          "MINGW64_BIN=/mingw64/bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_PREFIX=/mingw64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=/mingw64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
          $cc = $compiler
          $cxx = \"$compiler++\"
        }
        "CC=$cc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CXX=$cxx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        if ($toolchain) {
          "CMAKE_TOOLCHAIN_FILE=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
        "cc=$cc" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "cxx=$cxx" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "toolchain-file=$toolchain" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "cache-key=${{ runner.os }}-${{ inputs.compiler }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
